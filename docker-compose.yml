services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist bookings.json, reviews.json, services.json edits without rebuilding the image
      - ./app/data:/app/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser talks to the backend at this host-visible URL. Since this
        # is baked in at build time, it must point to wherever the backend
        # is reachable from the *browser*, not the Docker-internal network
        # (i.e. not http://backend:8000 — the browser can't resolve that).
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped