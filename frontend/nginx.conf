server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side routing) needs every unknown path to fall
    # back to index.html, otherwise refreshing /reviews or /services directly
    # gives a 404 from nginx instead of letting React Router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; index.html itself stays uncached
    # so deployments are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}