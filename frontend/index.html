<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Beauty Salon — Hair, Skin &amp; Nails in Lahore</title>
    <meta
      name="description"
      content="Look after yourself, beautifully. Book your appointment or chat with us — hair, facials, manicures and pedicures at Beauty Salon."
    />

    <!-- Social sharing (WhatsApp/Facebook/Twitter link previews) -->
    <!-- og:image/twitter:image below are relative paths for now — once
         this site is live on a real domain, change them to absolute URLs
         (e.g. https://yoursalon.com/images/hero.jpg), since external
         platforms fetching the preview can't resolve a relative path. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beauty Salon" />
    <meta property="og:title" content="Beauty Salon — Hair, Skin & Nails in Lahore" />
    <meta
      property="og:description"
      content="Look after yourself, beautifully. Book your appointment or chat with us — hair, facials, manicures and pedicures at Beauty Salon."
    />
    <meta property="og:image" content="/images/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beauty Salon — Hair, Skin & Nails in Lahore" />
    <meta
      name="twitter:description"
      content="Look after yourself, beautifully. Book your appointment or chat with us — hair, facials, manicures and pedicures at Beauty Salon."
    />
    <meta name="twitter:image" content="/images/hero.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
